<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VisionLoop — TV</title>
<link rel="icon" href="/assets/LogoSemFundo.png" type="image/png">
<link rel="stylesheet" href="/css/tv.css">
</head>
<body>

<div id="fsOverlay">
  <button id="fsBtn" onclick="confirmFullscreen()">⛶ Entrar em tela cheia</button>
  <div id="fsLabel">Pressione OK no controle remoto para confirmar</div>
</div>


<!-- Botao de tema e Voltar: so fazem sentido na tela de espera (parear/
     aguardar), por isso ficam dentro do #standby em vez de fixos por cima
     do video em reproducao — assim somem sozinhos quando o video comeca. -->
<div id="standby" style="display:flex; flex-direction:column; align-items:center; gap:28px; text-align:center; padding:40px;">
  <button id="backBtnTv" onclick="goBack()" aria-label="Voltar">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"></path><path d="M19 12H5"></path></svg>
    Voltar
  </button>
  <button id="themeToggle" onclick="toggleTheme()" aria-label="Alternar tema">
    <svg id="iconMoon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path></svg>
    <svg id="iconSun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path></svg>
  </button>
  <div><img class="logo-big" src="/assets/LogoSemFundo.png" alt="VisionLoop"></div>
  <div class="code-box">
    <div class="code-label" id="codeLabel">Código de pareamento</div>
    <div class="code-value" id="codeDisplay">
      <!-- !!!Aqui fica onde está o aguardando da  Televisão!!!-->
      <span class="pulse" style="font-size:24px; letter-spacing:2px; color:#4e17b4;">aguardando...</span>
    </div>
  </div>
  <div style="font-size:12px; color:#666; max-width:320px; line-height:1.5;" id="pairingHint">
    Peça pra alguém digitar esse código no painel de controle (aba "TVs pareadas → Parear TV") para vincular esta TV a uma conta.
  </div>
  <div class="pair-info">
    <div id="ctrlStatus" class="pair-status">verificando…</div>
  </div>
  <div class="name-input-wrap">
    <input type="text" id="tvNameInput" placeholder="Nome desta TV (ex: Sala, Loja...)" maxlength="30">
    <button onclick="setName()">Salvar</button>
  </div>
  <label class="compat-toggle" id="compatLabel">
    <input type="checkbox" id="compatMode" onchange="setCompatMode(this.checked)">
    <span>Modo compatibilidade — carrega um vídeo por vez. Marque se esta TV travar,
    piscar ou ficar com a tela preta na troca de vídeos.</span>
  </label>
  <div class="conn-status">
    <div class="conn-dot" id="connDot"></div>
    <span id="connText">Conectando ao servidor...</span>
  </div>
  <div id="tvVersion" style="font-size:11px; color:#333;"></div>
</div>

<div id="videoContainer">
  <!-- Dois elementos de vídeo se revezam: enquanto um toca, o outro já pode
       estar recebendo o próximo vídeo da playlist em segundo plano (preload real). -->
  <video id="playerA" playsinline preload="auto"></video>
  <video id="playerB" playsinline preload="auto"></video>
  <div id="imageDisplay"></div>
  <div id="overlay">
    <div id="overlayIcon">⏸</div>
    <div id="overlayText">Pausado</div>
  </div>
  <div id="plBadge">🔁 <span id="plBadgeText"></span></div>
</div>

<script src="/js/tv.js"></script>
</body>
</html>
