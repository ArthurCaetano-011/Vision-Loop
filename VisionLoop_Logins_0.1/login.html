<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VisionLoop — Entrar</title>
<link rel="icon" href="/assets/LogoSemFundo.png" type="image/png">
<link rel="stylesheet" href="/css/controller.css">
<style>
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    background: var(--bg);
  }
  .login-card {
    width: 100%;
    max-width: 380px;
    margin: 20px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-soft);
    padding: 32px 28px;
  }
  .login-logo {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-bottom: 24px;
    font-size: 20px;
    font-weight: 700;
    color: var(--text);
  }
  .login-logo img { width: 32px; height: 32px; object-fit: contain; }
  .login-field { margin-bottom: 16px; }
  .login-field label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  .login-field input {
    width: 100%;
    padding: 11px 12px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text);
    font-size: 14px;
    outline: none;
  }
  .login-field input:focus { border-color: var(--accent); }
  .login-error {
    display: none;
    background: color-mix(in srgb, var(--red) 12%, transparent);
    border: 1px solid color-mix(in srgb, var(--red) 35%, transparent);
    color: var(--red);
    font-size: 13px;
    padding: 10px 12px;
    border-radius: var(--radius);
    margin-bottom: 16px;
  }
  .login-btn {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: var(--radius);
    background: var(--accent);
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  .login-btn:disabled { opacity: 0.6; cursor: default; }
  .login-btn:not(:disabled):hover { box-shadow: var(--shadow-glow); }
</style>
</head>
<body>

<form class="login-card" id="loginForm" autocomplete="on">
  <div class="login-logo">
    <img src="/assets/LogoSemFundo.png" alt="VisionLoop">
    VisionLoop
  </div>

  <div class="login-error" id="loginError"></div>

  <div class="login-field">
    <label for="email">E-mail</label>
    <input type="email" id="email" name="email" autocomplete="username" required>
  </div>

  <div class="login-field">
    <label for="senha">Senha</label>
    <input type="password" id="senha" name="senha" autocomplete="current-password" required>
  </div>

  <button type="submit" class="login-btn" id="loginBtn">Entrar</button>
</form>

<script>
  // Mesma chave de tema usada nas outras páginas, só pra a tela de login
  // não "piscar" clara se o resto do app estiver no escuro.
  if (localStorage.getItem('vl_theme') === 'dark') {
    document.body.classList.add('dark');
  }

  const form = document.getElementById('loginForm');
  const errorBox = document.getElementById('loginError');
  const btn = document.getElementById('loginBtn');

  // Se o usuário já tem uma sessão válida (ex.: voltou pra /login.html sem
  // precisar), manda direto pro controlador em vez de pedir login de novo.
  fetch('/me').then((r) => {
    if (r.ok) window.location.href = '/controller.html';
  }).catch(() => {});

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    errorBox.style.display = 'none';
    btn.disabled = true;
    btn.textContent = 'Entrando...';

    fetch('/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        email: document.getElementById('email').value,
        senha: document.getElementById('senha').value,
      }),
    })
      .then(async (r) => {
        const data = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(data.error || 'Não foi possível entrar.');
        window.location.href = '/controller.html';
      })
      .catch((err) => {
        errorBox.textContent = err.message || 'Não foi possível entrar. Tente de novo.';
        errorBox.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Entrar';
      });
  });
</script>

</body>
</html>
